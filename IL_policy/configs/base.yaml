defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  output_subdir: null
  run:
    dir: .

# System/Global
device: "cuda"
seed: 42

session: ${policy.name}-${now:%Y%m%d_%H%M%S}
base_dir: ${hydra:runtime.cwd}
output_dir: ${base_dir}/outputs/${task.name}-${session}
log_dir: ${output_dir}/logs
checkpoint_dir: ${output_dir}/checkpoints
checkpoint_path: null
crop_shape: [216, 216]

# Optimizer
optimizer_lr: 1e-4
optimizer_betas: [0.95, 0.999]
optimizer_eps: 1e-8
optimizer_weight_decay: 1e-6

# Scheduler
scheduler_name: cosine
scheduler_warmup_steps: 500

task:
  name: "default"
  dataset_root: "data/ID_base/dataset.zarr"
  state_dim: 3
  action_dim: 3
  use_delta_action: true

policy:
  name: "diffusion"
  
  obs_horizon: 1
  pred_horizon: 16
  action_horizon: 8

  # Vision encoder
  crop_is_random: true
  spatial_softmax_num_keypoints: 32
  
  noise_scheduler:
    type: DDIM
    num_train_timesteps: 100
    num_inference_steps: 20
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    prediction_type: epsilon
    clip_sample: true
    clip_sample_range: 1.0

  unet:
    down_dims: [256, 512, 1024]
    kernel_size: 5
    n_groups: 8
    diffusion_step_embed_dim: 256
    use_film_scale_modulation: true

train:
  batch_size: 128
  num_workers: 4
  steps: 10000
  log_freq: 100
  save_freq: 1000
  use_ema: true
  ema_power: 0.75
  max_grad_norm: 1.0
  use_amp: true
  cache_all: true

wandb:
  entity: "ysl2683-seoul-national-university-ofscience-and-technology"
  project: "PlanarPeg_DP_Base"
  name: ${task.name}-${session}

val:
  num_episodes: 2
  val_offline_freq: 200
  batch_size: 64
  num_workers: 4
  eval_n_episodes: 10
  render_mode: null
