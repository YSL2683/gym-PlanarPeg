defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  output_subdir: null
  run:
    dir: .

# System/Global
device: "cuda"
seed: 42
eval_dir: null
checkpoint_name: "best.pth"
crop_shape: [216, 216]

# Optimizer
optimizer_lr: 1e-4
optimizer_betas: [0.95, 0.999]
optimizer_eps: 1e-8
optimizer_weight_decay: 1e-6

# Scheduler
scheduler_name: cosine
scheduler_warmup_steps: 500

task:
  name: "planar_peg"
  dataset_root: "data/ID_base/dataset.zarr"
  state_dim: 3
  action_dim: 3

policy:
  name: "diffusion"
  
  obs_horizon: 1
  pred_horizon: 16
  action_horizon: 8

  # Vision encoder
  crop_is_random: true
  spatial_softmax_num_keypoints: 32
  
  noise_scheduler:
    type: DDIM
    num_train_timesteps: 100
    num_inference_steps: 20
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    prediction_type: epsilon
    clip_sample: true
    clip_sample_range: 1.0

  unet:
    down_dims: [256, 512, 1024]
    kernel_size: 5
    n_groups: 8
    diffusion_step_embed_dim: 256
    use_film_scale_modulation: true

train:
  batch_size: 64
  steps: 100000
  log_freq: 100
  save_freq: 10000
  use_ema: true
  ema_power: 0.75
  max_grad_norm: 1.0

wandb:
  entity: "ysl2683-seoul-national-university-ofscience-and-technology"
  project: "PlanarPeg_DP_Base"
  name: "dp_run_1"

val:
  num_episodes: 2
  val_offline_freq: 200
  batch_size: 64
