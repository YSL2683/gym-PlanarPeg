# Base Policy
base_policy:
  run_dir: null  # Must be set: path to IL_policy training run directory
  checkpoint: "best.pth"  # or "step_10000.pth"

# Environment
env:
  id: "PlanarPegInsertion-v0"
  grid: "ood_start_position"
  max_episode_steps: 300

# Dataset (for offline data + normalization stats)
dataset_root: "data/ID_base/ID_base_v2.zarr"

# Latent Encoder (Step 1 output)
latent_cache_path: "residual_rl/outputs/latent_encoder-20260626_210750/latent_cache.pt" # MUST BE UPDATED to the actual run folder generated by Step 1

# Residual Actor
actor:
  hidden_dim: 256
  action_scale: 0.15
  last_layer_init_scale: 0.0
  lr: 3e-4

# REDQ Critic
critic:
  hidden_dim: 256
  num_q: 10
  num_q_subsample: 2
  lr: 3e-4
  target_tau: 0.005

# SAC
sac:
  discount: 0.99
  init_temperature: 0.1
  alpha_lr: 1e-4
  actor_update_freq: 2

# Training
train:
  total_timesteps: 200000
  learning_starts: 5000
  critic_warmup_steps: 10000
  batch_size: 256
  buffer_size: 300000
  offline_fraction: 0.5

# Dense Reward
dense_reward:
  discount_gamma: 0.98
  p_reward: 1.0

# Evaluation
eval:
  freq: 5000
  episodes: 20
  grid: "default"  # Can be changed to OOD grid

# Logging
wandb:
  entity: "ysl2683-seoul-national-university-ofscience-and-technology"
  project: "PlanarPeg_ResidualRL"
  mode: "online"

# System
device: "cuda"
seed: 42
output_dir: "residual_rl/outputs"
